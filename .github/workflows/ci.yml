# Production CI — authored fresh for the production repository (dev/prod split
# Phase 2; dev's workflow is not projected). Proves the promoted product: lint,
# full-history secret scan, tests, and pack-content sanity.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual full-history scan; also note: the repo's very first
    # push (zero before-SHA) made gitleaks-action's range scan fail spuriously —
    # content verified clean by a local full scan the same day
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run lint
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
